<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrewPoints — Offline</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;min-height:100vh;min-height:100dvh;
  background:#FFFCF8;color:#2D1B06;
  font-family:'DM Sans',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  position:fixed;inset:0;
  -webkit-font-smoothing:antialiased;
}

.box{text-align:center;padding:32px;max-width:400px;width:100%;}

.cup{
  width:80px;height:80px;margin:0 auto 28px;
  position:relative;
}
.cup-body{
  width:56px;height:48px;background:#E8DFD2;border-radius:0 0 14px 14px;
  margin:0 auto;position:relative;
}
.cup-handle{
  width:16px;height:24px;border:4px solid #E8DFD2;border-left:none;
  border-radius:0 10px 10px 0;
  position:absolute;right:-16px;top:8px;
}
.cup-steam{position:absolute;top:-20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}
.steam{
  width:3px;height:16px;background:#D5C9BA;border-radius:99px;
  animation:steam 2s ease-in-out infinite;
  opacity:0.5;
}
.steam:nth-child(2){animation-delay:.4s;height:12px;}
.steam:nth-child(3){animation-delay:.8s;height:14px;}
@keyframes steam{
  0%,100%{transform:translateY(0) scaleY(1);opacity:0.5;}
  50%{transform:translateY(-6px) scaleY(1.2);opacity:0.2;}
}

h1{
  font-family:'DM Serif Display',serif;
  font-size:24px;color:#2D1B06;margin-bottom:8px;
}

p{
  font-size:14px;color:#8C7A65;line-height:1.6;margin-bottom:28px;
}

.retry{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;border-radius:12px;border:none;
  background:#2D1B06;color:#FFFCF8;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.retry:hover{background:#1A0F00;box-shadow:0 4px 16px rgba(45,27,6,0.15);transform:translateY(-1px);}
.retry:active{transform:translateY(0);}
.retry .spin{display:inline-block;transition:transform .3s;}

.footer{
  position:fixed;bottom:20px;left:0;right:0;
  text-align:center;font-size:11px;color:#D5C9BA;
}
</style>
</head>
<body>

<div class="box">
  <div class="cup">
    <div class="cup-body">
      <div class="cup-handle"></div>
    </div>
    <div class="cup-steam">
      <div class="steam"></div>
      <div class="steam"></div>
      <div class="steam"></div>
    </div>
  </div>

  <h1>You're offline</h1>
  <p>Looks like your connection took a coffee break. Check your internet and try again.</p>

  <button class="retry" onclick="tryReconnect(this)">
    <span class="spin" id="icon">↻</span>
    Try again
  </button>
</div>

<div class="footer">☕ BrewPoints</div>

<script>
function tryReconnect(btn) {
  var icon = document.getElementById('icon');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" style="animation:rotating .6s linear infinite;">↻</span> Connecting...';

  var style = document.createElement('style');
  style.textContent = '@keyframes rotating{from{transform:rotate(0)}to{transform:rotate(360deg)}}';
  document.head.appendChild(style);

  setTimeout(function() {
    if (navigator.onLine) {
      window.location.reload();
    } else {
      btn.innerHTML = '<span class="spin">↻</span> Still offline';
      btn.style.background = '#92400E';
      setTimeout(function() {
        btn.innerHTML = '<span class="spin">↻</span> Try again';
        btn.style.background = '';
        btn.disabled = false;
      }, 2000);
    }
  }, 1500);
}
</script>
</body>
</html>
